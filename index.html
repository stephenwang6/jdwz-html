<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>军队文职记忆题库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f2f4f8;color:#1f2937;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:640px;background:#f2f4f8;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:50;background:#1e3a8a;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar .btn-back{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:15px;padding:7px 12px;border-radius:8px;cursor:pointer}
.topbar .title{font-size:17px;font-weight:600;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .btn-icon{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:16px;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.progress-line{height:4px;background:#e5e7eb;position:sticky;top:0;z-index:49}
.progress-line>div{height:100%;background:#22c55e;transition:width .25s}
/* ---------- 首页 ---------- */
.hero{background:linear-gradient(160deg,#1e3a8a,#2563eb);color:#fff;padding:22px 16px 26px;border-radius:0 0 22px 22px}
.hero h1{font-size:21px;margin-bottom:4px}
.hero p{font-size:13px;opacity:.85}
.stat-row{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 6px;text-align:center;backdrop-filter:blur(4px)}
.stat b{display:block;font-size:19px}
.stat span{font-size:11px;opacity:.85}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.mode-card{background:#fff;border-radius:14px;padding:16px 14px;cursor:pointer;box-shadow:0 1px 4px rgba(15,23,42,.06);border:1.5px solid transparent;transition:transform .1s}
.mode-card:active{transform:scale(.97)}
.mode-card .ic{font-size:26px}
.mode-card h3{font-size:15px;margin:8px 0 3px}
.mode-card p{font-size:12px;color:#6b7280}
.mode-card.hot{border-color:#f59e0b}
.mode-card .badge{display:inline-block;background:#fee2e2;color:#b91c1c;font-size:11px;padding:1px 7px;border-radius:20px;margin-left:6px}
.mode-card .badge.ok{background:#dcfce7;color:#15803d}
.sec-title{padding:4px 16px 8px;font-size:15px;font-weight:700;color:#111827;display:flex;justify-content:space-between;align-items:center}
.sec-title small{font-weight:400;font-size:12px;color:#6b7280}
.cat-list{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.cat-card{background:#fff;border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.cat-card:active{background:#f8fafc}
.cat-card .num{min-width:34px;height:34px;border-radius:10px;background:#eff6ff;color:#2563eb;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.cat-card .info{flex:1;min-width:0}
.cat-card .info b{font-size:14.5px;display:block}
.cat-card .info .sub{font-size:12px;color:#6b7280;margin-top:2px}
.cat-bar{height:5px;background:#eef2f7;border-radius:4px;margin-top:6px;overflow:hidden}
.cat-bar>div{height:100%;background:#2563eb;border-radius:4px}
.cat-card .go{color:#9ca3af;font-size:18px}
.switch-row{display:flex;align-items:center;gap:12px;margin:4px 16px 0;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(15,23,42,.05);cursor:pointer}
.switch-row:active{background:#f8fafc}
.switch-row .txt{flex:1;min-width:0}
.switch-row .txt b{font-size:14.5px;display:block}
.switch-row .txt .sub{font-size:12px;color:#6b7280;margin-top:2px}
.switch{width:46px;height:26px;border-radius:20px;background:#cbd5e1;position:relative;flex-shrink:0;transition:background .18s}
.switch>i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s}
.switch-row.on .switch{background:#2563eb}
.switch-row.on .switch>i{transform:translateX(20px)}
.footer-note{text-align:center;font-size:11px;color:#9ca3af;padding:18px 0 26px}
/* ---------- 答题页 ---------- */
.qwrap{padding:16px 16px 130px}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600}
.tag.s{background:#e0f2fe;color:#0369a1}
.tag.m{background:#f3e8ff;color:#7e22ce}
.tag.j{background:#dcfce7;color:#15803d}
.tag.cat{background:#f1f5f9;color:#475569;font-weight:500}
.qstem{font-size:17px;line-height:1.65;font-weight:600;margin-bottom:16px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;border:1.5px solid #d7dde8;border-radius:12px;padding:13px 14px;font-size:15.5px;line-height:1.55;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:border-color .12s,background .12s;text-align:left;width:100%}
.opt .letter{min-width:24px;height:24px;border-radius:50%;border:1.5px solid #cbd5e1;color:#64748b;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.opt.sel{border-color:#2563eb;background:#eff6ff}
.opt.sel .letter{background:#2563eb;border-color:#2563eb;color:#fff}
.opt.right{border-color:#16a34a;background:#f0fdf4}
.opt.right .letter{background:#16a34a;border-color:#16a34a;color:#fff}
.opt.wrong{border-color:#dc2626;background:#fef2f2}
.opt.wrong .letter{background:#dc2626;border-color:#dc2626;color:#fff}
.opt:disabled{cursor:default}
.opt .mark{margin-left:auto;font-size:17px;flex-shrink:0}
.answer-area{margin-top:16px;display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:disabled{background:#93c5fd;cursor:default}
.btn-ghost{background:#fff;color:#374151;border:1.5px solid #d7dde8}
.exp-box{margin-top:16px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:14px;font-size:14.5px;line-height:1.7;display:none}
.exp-box.show{display:block;animation:fadeUp .25s}
.exp-box .exp-title{font-weight:700;color:#b45309;margin-bottom:6px;font-size:13.5px}
.exp-box .verdict{font-weight:700;margin-bottom:6px;font-size:14.5px}
.exp-box .verdict.ok{color:#16a34a}
.exp-box .verdict.no{color:#dc2626}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ---------- 底部操作栏 ---------- */
.actionbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid #e5e7eb;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:60}
.actionbar .btn{flex:1}
.actionbar .nav{display:flex;gap:8px}
.actionbar .nav .btn{flex:none;min-width:64px}
.btn-star{background:#fff;border:1.5px solid #d7dde8;color:#6b7280}
.btn-star.on{background:#fef3c7;border-color:#f59e0b;color:#b45309}
/* ---------- 结果页 ---------- */
.result{padding:30px 20px;text-align:center}
.result .score-ring{width:150px;height:150px;border-radius:50%;margin:10px auto 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.result .score-ring b{font-size:44px;line-height:1}
.result .score-ring span{font-size:13px;margin-top:6px;opacity:.9}
.result .score-ring.pass{background:linear-gradient(135deg,#16a34a,#22c55e)}
.result .score-ring.fail{background:linear-gradient(135deg,#dc2626,#ef4444)}
.result h2{font-size:20px;margin-bottom:6px}
.result p{color:#6b7280;font-size:14px}
.result .rbtns{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.result .rbtns .btn{padding:15px}
.wrong-list{margin-top:18px;text-align:left}
.wrong-list h3{font-size:15px;margin-bottom:10px;color:#111827}
.wrong-item{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.6;cursor:pointer;border:1px solid #e5e7eb}
.wrong-item .wt{font-weight:600;margin-bottom:6px}
.wrong-item .wy{font-size:13px;color:#6b7280}
.wrong-item .wy b.red{color:#dc2626}
.wrong-item .wy b.green{color:#16a34a}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;color:#fff;font-size:14px;padding:10px 18px;border-radius:24px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center}
.toast.show{opacity:.92}
.empty{padding:60px 20px;text-align:center;color:#9ca3af}
.empty .ic{font-size:44px;margin-bottom:12px}
@media (min-width:641px){body{background:#e5e9f0}#app{box-shadow:0 0 24px rgba(15,23,42,.08)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ================= 题库数据 ================= */
const QUESTIONS = [];
function q(cat, type, stem, opts, ans, exp) {
  if (type === "m" && typeof ans === "string") {
    ans = ans.split(",").map(function (x) { return parseInt(x, 10); });
  }
  QUESTIONS.push({ id: QUESTIONS.length + 1, cat: cat, type: type, stem: stem, opts: opts, ans: ans, exp: exp });
}
/* ===== 国防常识 ===== */
q("国防常识","s","国防的主体是（ ）。",["全体公民","国家","政府","武装力量"],1,"国防的主体是国家。国家是国防活动的组织者和实行者，国防是国家的防务，说到底是国家的事，是国家大局所系、根本利益所在。");
q("国防常识","s","国防的对象首先是（ ），其次是制止武装颠覆和分裂。",["经济制裁","抵抗外敌侵略","文化渗透"],1,"我国的国防对象，首先是抵抗外敌“侵略”，其次是制止“武装颠覆和分裂”，即制止国内企图分裂国家、颠覆国家政权、推翻社会主义制度的武装叛乱或者武装暴乱。");
q("国防常识","s","在实现国防目的的诸手段中，（ ）始终是国防的最主要手段，也是最基本的手段。",["政治博弈","经济建设","外交斡旋","军事活动"],3,"对付武装侵犯和武装暴乱最根本最有效的方式是采取军事手段，因此军事手段始终是国防的最主要手段，也是最基本的手段。");
q("国防常识","s","国防的基本内容包括（ ）。",["国防建设与国防斗争","国防建设与国防教育","武装力量建设与国防科技","国防斗争与国防动员"],0,"国防的基本内容包括国防建设与国防斗争两个方面。国防建设是为提高国防实力而进行的各方面建设；国防斗争是以军事为主，包括政治、经济、外交等方面的行动。");
q("国防常识","s","维护国家安全利益是国防的（ ）。",["根本职能","主要手段","基本内容","唯一任务"],0,"国防服务于国家，维护国家的安全利益是国防的根本职能；捍卫国家主权、领土完整和防止外来侵略、颠覆是国防的主要任务。");
q("国防常识","s","《中华人民共和国国防法》规定，中华人民共和国奉行（ ）国防政策。",["中立型","进攻性","防御性","扩张性"],2,"《国防法》第六条第一款规定：“中华人民共和国奉行防御性国防政策，独立自主、自力更生地建设和巩固国防，实行积极防御，坚持全民国防。”");
q("国防常识","s","我国（ ），坚持全民国防。",["实行被动防御","实行消极防御","实行积极防御","实行主动防御"],2,"《国防法》第六条规定我国奉行防御性国防政策，独立自主、自力更生地建设和巩固国防，实行积极防御，坚持全民国防。");
q("国防常识","s","我国的国防目的不具有扩张性质，也不与他国结盟，属于（ ）。",["联盟型国防","中立型国防","自卫型国防","扩张型国防"],2,"我国的国防目的是保卫国家主权、统一、领土完整、安全和发展利益，不具有扩张性质，也不与他国结盟，属于自卫型国防。");
q("国防常识","s","国防的基本类型不包括（ ）。",["中立型","海洋型","扩张型","联盟型"],1,"当今世界国防的基本类型有四种：扩张型、自卫型、联盟型和中立型。没有“海洋型”这一说法。");
q("国防常识","m","国防的要素包括（ ）。",["手段","主体","目的","对象"],[0,1,2,3],"国防的基本要素包括：主体（国家）、对象（侵略和武装颠覆、分裂）、目的（保卫国家主权、统一、领土完整、安全和发展利益）、手段（军事活动及与军事有关的政治、经济、外交、科技、教育等活动）。");
q("国防常识","s","现代国防是国家（ ）的集中体现。",["经济实力","军事实力","综合国力","科技实力"],2,"现代国防是国家综合国力的集中体现。现代国防的主体是军事力量，还包括与国防相关的非军事力量，如政治、经济、外交、科技、文化等，并依赖于国家将潜力转化为实力的能力。");
q("国防常识","s","现代国防既是国家行为，又是（ ）。",["政府行为","政党行为","军队行为","国际行为"],3,"现代国防作为一种国家行为的同时，也日益成为一种国际行为。世界和平与战争、国际经济繁荣与衰退都直接影响国家和国防建设。");
q("国防常识","s","和平时期国防通过展示和运用强大国防力量，达到“不战而屈人之兵”，依靠的是现代国防的（ ）。",["外交功能","经济功能","作战功能","威慑功能"],3,"威慑是和平时期国防的主要功能，通过直接展示和运用强大的国防力量，给对方造成巨大压力，使对方不敢运用武力，达到“不战而屈人之兵”的目的。");
q("国防常识","s","现代国防强弱的一个重要标志是（ ）。",["现役部队的规模","国土面积的大小","核武器的数量","战争潜力能否转化为战争实力"],3,"现代国防虽然仍以军事力量为主体，但它还要靠国家潜力转化为作战实力，战争潜力能否转化为战争实力是现代国防强弱的一个重要标志。");
q("国防常识","j","国防是伴随着国家的出现而产生的。",["正确","错误"],0,"正确。有国就有防，国防伴随着国家的形成而产生，国防与国家密不可分、相辅相成。");
q("国防常识","j","国家的性质、制度、政策决定着国防建设。",["正确","错误"],0,"正确。国防必须服从、服务于国家的根本政治制度和政策，国家的社会制度和政策决定国防的性质和形式。");
q("国防常识","s","联盟型国防中有一个大国处于盟主地位、其余国家处于从属地位的，称为（ ）。",["扩张型联盟","多元体系联盟","一元体系联盟","自卫型联盟"],2,"从联盟内国家之间的关系看，联盟型国防分为一元体系联盟（有一个大国处于盟主地位）和多元体系联盟（各国之间为伙伴关系，共同协商防卫大计）。");
q("国防常识","m","现代国防的主要特征包括（ ）。",["既是国家行为，又是国际行为","是多种斗争形式的综合角逐","具有多层次的目标体系","是国家综合国力的集中体现"],[0,1,2,3],"现代国防的主要特征：一是国家综合国力的集中体现；二是多种斗争形式的综合角逐；三是具有多层次的目标体系；四是既是国家行为，又是国际行为；五是威慑功能日益强大；六是战争潜力能否转化为战争实力是强弱的重要标志。");
q("国防常识","s","从范围上看，现代国防目标的最低层次是（ ）。",["区域目标","发展目标","全球目标","自卫目标"],3,"从范围上看，现代国防目标分为自卫目标（最低，限定在国家领土、领海范围内）、区域目标（中级，限定在国土之外有限的周边区域）和全球目标（最高，遍及全球）。");
q("国防常识","s","从内涵上看，现代国防的目标包括（ ）。",["生存目标和发展目标","自卫目标和全球目标","区域目标和经济目标","政治目标和军事目标"],0,"从内涵上看，现代国防目标分为生存目标（保证国家生存、民族独立）和发展目标（为国家争取适合发展的空间）。");
q("国防常识","s","扩张型国防的特点是把本国的“安全”建立在（ ）。",["国际联盟的基础上","经济合作的基础上","别国屈服的基础上","自身实力的基础上"],2,"扩张型国防奉行霸权主义侵略扩张政策，对别国进行渗透、颠覆和侵略，其特点是把本国的“安全”建立在别国屈服的基础上。");
q("国防常识","j","我国国防建设以反对侵略和维护和平为目的。",["错误","正确"],1,"正确。我国是社会主义国家，在国际关系中强调和平共处、平等互利，我国的国防在积极防御战略方针指导下，以反对侵略和维护和平为目的。");
q("国防常识","s","国防斗争是指为了国家的安全和国家综合利益，反抗外来侵略而采取的以（ ）为主的行动。",["外交","经济","军事","文化"],2,"国防斗争是指为了国家的安全和国家综合利益，反抗外来侵略，支持正义事业和斗争而采取的以军事为主，包括政治、经济、外交等方面的行动。");
q("国防常识","m","下列属于公民、组织国防权利的有（ ）。",["对国防建设提出建议的权利","依照法律服兵役","因国防建设和军事活动受到直接经济损失可依法获得补偿","对危害国防利益的行为进行制止或者检举的权利"],[0,2,3],"公民和组织的国防权利：对国防建设提出建议的权利；对危害国防利益的行为进行制止或者检举的权利；因国防建设和军事活动在经济上受到直接损失的，可依照国家有关规定获得补偿。服兵役属于国防义务。");
q("国防常识","s","“保卫祖国、抵抗侵略是中华人民共和国每一个公民的神圣职责”出自（ ）。",["国防教育法","国防法","宪法","兵役法"],2,"《中华人民共和国宪法》规定，每一个公民都有维护祖国安全、荣誉和利益的义务，保卫祖国、抵抗侵略是每一个公民的神圣职责。");
/* ===== 中国国防 ===== */
q("中国国防","s","我国古代国防是指从公元前21世纪（ ）建立到1840年鸦片战争爆发期间的国防。",["商王朝","周王朝","秦朝","夏王朝"],3,"我国古代的国防是指从公元前21世纪夏王朝建立到公元1840年鸦片战争爆发期间的国防，大约有4000年历史。");
q("中国国防","s","夏、商、周时期实行“兵农合一”“寓兵于民”政策、只用兵不养兵的兵役制度是（ ）。",["世兵制","民军制","征兵制","府兵制"],1,"夏、商、周时期的主要兵制是民军制，实行“兵农合一”“寓兵于民”的政策，主要特点是“只用兵，不养兵”。");
q("中国国防","s","战国至秦汉时期实行、有明确服役年龄和年限的兵役制度是（ ）。",["卫所制","募兵制","民军制","征兵制"],3,"战国至秦汉时期开始实行征兵制，主要特点是有明确的服役年龄和年限。");
q("中国国防","s","隋唐时期实行、其特点是兵制与田赋税制紧密结合的兵役制度是（ ）。",["府兵制","征兵制","世兵制","募兵制"],0,"隋唐时期主要是府兵制，其特点是兵制与田赋税制紧密结合。");
q("中国国防","s","唐代后期与宋代实行、由国家发粮饷、一旦应募终身为兵的兵役制度是（ ）。",["民军制","募兵制","征兵制","府兵制"],1,"唐代后期与宋代实施募兵制，实行国家招募士兵的方式，由国家发粮饷，一旦应募，终身为兵。");
q("中国国防","s","三国两晋南北朝和元朝实行、“军民分离，父死子继、世代为兵”的兵役制度是（ ）。",["府兵制","世兵制","征兵制","募兵制"],1,"世兵制特点是军民分离，各有户籍，一旦编为军户，父死子继，兄终弟及，世代为兵。明代的卫所制和清朝的“八旗军”本质上也是一种世兵制。");
q("中国国防","s","明代的兵役制度是（ ）。",["府兵制","卫所制","世兵制","募兵制"],1,"明代实行卫所制，卫、所人口平时务农，战时抽男丁入伍；卫所制和清朝的“八旗军”本质上也是一种世兵制。");
q("中国国防","s","清朝的兵役制度主要表现为（ ）。",["征兵制","卫所制","府兵制","八旗军"],3,"清代主要是“八旗军”，旗内青壮男丁为“披甲人”负责打仗，“披甲人”父老子继，本质上也是一种世兵制。");
q("中国国防","s","一般所谓的长城遗址为明长城，它全长约（ ），是我国古代著名的国防工程体系。",["6000千米","12700千米","5000千米","8851.8千米"],3,"古长城始建于春秋战国时期，一般所谓的长城遗址为明长城，全长8851.8千米，是我国古代著名的国防工程体系。");
q("中国国防","s","北宋朝廷将七部军事著作编成《武经七书》。下列不属于《武经七书》的是（ ）。",["《孙膑兵法》","《六韬》","《孙子兵法》","《吴子兵法》"],0,"《武经七书》包括《孙子兵法》《司马法》《吴子兵法》《尉缭子》《六韬》《三略》《李卫公问对》七部，不包括《孙膑兵法》。");
q("中国国防","s","世界上公认的现存最早的军事理论著作是（ ），其作者孙武被称为“东方兵学的鼻祖”。",["《孙膑兵法》","《武经七书》","《孙子兵法》","《三十六计》"],2,"《孙子兵法》是世界上公认的现存最早的军事理论著作，作者孙武被尊称为“兵圣”“东方兵学的鼻祖”。");
q("中国国防","s","我国古代海防建设主要从（ ）开始，为防倭寇袭扰修建了卫城、所城相结合的防御工程体系。",["宋代","明代","唐代","清代"],1,"海防建设主要从明代开始。为防倭寇袭扰，明代在沿海主要地段陆续修建了以卫城、所城为骨干，堡、寨、墩、烽堠和障碍物相结合的防御工程体系。");
q("中国国防","s","中国近代国防是指自1840年鸦片战争开始到（ ）新中国成立这一时期的国防。",["1912年","1921年","1919年","1949年"],3,"中国近代国防是指自1840年鸦片战争开始到1949年新中国成立，即清朝末期、北洋军阀统治时期和国民党政府统治时期的国防，特征是孱弱、衰败和屈辱。");
q("中国国防","s","依照宪法规定，（ ）决定战争与和平的问题。",["国务院","全国人民代表大会","国家主席","全国人大常委会"],1,"《国防法》第十二条规定：全国人民代表大会依照宪法规定，决定战争和和平的问题。");
q("中国国防","s","依照宪法规定，（ ）决定战争状态的宣布，决定全国总动员或者局部动员。",["全国人大常委会","中央军委","全国人民代表大会","国家主席"],0,"全国人大常委会依照宪法规定，决定战争状态的宣布，决定全国总动员或者局部动员。国家主席根据全人大和全人常的决定，宣布战争状态，发布动员令。");
q("中国国防","s","根据全国人大及其常委会的决定，宣布战争状态、发布动员令的国家机关是（ ）。",["国防部长","国家主席","国务院总理","中央军委主席"],1,"《国防法》第十三条规定：中华人民共和国主席根据全国人民代表大会的决定和全国人大常委会的决定，宣布战争状态，发布动员令。");
q("中国国防","s","领导和管理国防建设事业的是（ ）。",["中央军委","国务院","全国人大常委会","全国人大"],1,"《宪法》第八十九条规定，国务院行使“领导和管理国防建设事业”的职权。");
q("中国国防","s","决定军事战略和武装力量的作战方针的国家机关是（ ）。",["国防部","全国人大常委会","国务院","中央军事委员会"],3,"中央军委是国家最高军事决策和指挥机关，负责领导全国武装力量，决定军事战略和武装力量的作战方针。");
q("中国国防","s","全国的国防动员工作由（ ）共同领导。",["国务院和中央军委","国务院和国防部","全国人大和国务院","中央军委和战区"],0,"国防动员涉及军地两个方面，《国防法》规定国务院、中央军事委员会共同领导全国的国防动员工作。");
q("中国国防","s","国防动员坚持（ ）的方针。",["全民皆兵、长期战备","平战结合、军民结合、寓军于民","军民融合、平战分离","战备优先、军队主导"],1,"国防动员坚持平战结合、军民结合、寓军于民的方针，遵循统一领导、全民参与、长期准备、重点建设、统筹兼顾、有序高效的原则。");
q("中国国防","s","国防教育贯彻（ ）、长期坚持、讲求实效的方针。",["学校为主","国家主导","全民参与","全军配合"],2,"《国防法》第四十四条规定：国防教育贯彻全民参与、长期坚持、讲求实效的方针，实行经常教育与集中教育相结合、普及教育与重点教育相结合、理论教育与行为教育相结合的原则。");
q("中国国防","s","全民国防教育日是每年（ ）。",["8月1日","9月18日","12月4日","9月的第三个星期六"],3,"国家设立全民国防教育日，时间为每年9月的第三个星期六。");
q("中国国防","s","（ ）是全民国防教育的基础，是实施素质教育的重要内容。",["社会的国防教育","军队的国防教育","学校的国防教育","干部的国防教育"],2,"《国防法》规定，学校的国防教育是全民国防教育的基础，是实施素质教育的重要内容。普通高等学校和高中阶段学校应当按照规定组织学生军事训练。");
q("中国国防","s","领导全国的国防教育工作的国家机关是（ ）。",["国防部","中央军委","国务院","全国人大"],2,"《国防教育法》第六条第一款规定：国务院领导全国的国防教育工作。中央军事委员会协同国务院开展全民国防教育。地方各级人民政府领导本行政区域内的国防教育工作。");
q("中国国防","m","我国国防活动的基本原则包括（ ）。",["全民国防","积极防御","独立自主、自力更生","经济建设和国防建设协调、平衡、兼容发展"],[0,1,2,3],"国防活动基本原则：独立自主、自力更生的原则；积极防御的原则；全民国防的原则；经济建设和国防建设协调、平衡、兼容发展的原则。");
q("中国国防","s","国防经费依法实行（ ）。",["财政拨款","预算管理","社会募集","企业赞助"],1,"《国防法》第三十九条规定：国家保障国防事业的必要经费，国防经费的增长应当与国防需求和国民经济发展水平相适应，国防经费依法实行预算管理。");
q("中国国防","s","中国国防费按用途划分，主要由人员生活费、（ ）和装备费构成。",["教育经费","行政经费","训练维持费","科研经费"],2,"中国国防费按用途划分，主要由人员生活费、训练维持费和装备费构成。");
q("中国国防","s","战略物资储备应当规模适度、储存安全、调用方便、（ ），保障战时的需要。",["快速更换","长期保存","定期更换","不定期更换"],2,"《国防法》第四十九条规定：战略物资储备应当规模适度、储存安全、调用方便、定期更换，保障战时的需要。");
q("中国国防","m","新时代中国国防的鲜明特征包括（ ）。",["坚持永不扩张","坚持永不谋求势力范围","坚持永不首先使用核武器","坚持永不称霸"],[0,1,3],"《新时代的中国国防》白皮书指出：坚持永不称霸、永不扩张、永不谋求势力范围，是新时代中国国防的鲜明特征。不首先使用核武器是核政策，不属于鲜明特征。");
q("中国国防","s","新时代中国国防的根本目标是（ ）。",["维护地区霸权","称霸世界","扩张势力范围","坚决捍卫国家主权、安全、发展利益"],3,"新时代中国国防的根本目标是坚决捍卫国家主权、安全、发展利益。");
q("中国国防","s","新时代中国国防的战略指导是（ ）。",["御敌于国门之外","积极扩张","贯彻落实新时代军事战略方针","全球部署"],2,"新时代中国国防的战略指导是贯彻落实新时代军事战略方针；发展路径是坚持走中国特色强军之路；世界意义是服务构建人类命运共同体。");
q("中国国防","s","中国始终奉行在任何时候和任何情况下（ ）、无条件不对无核武器国家和无核武器区使用或威胁使用核武器的核政策。",["不发展核武器","不首先使用核武器","放弃核武器","首先使用核武器"],1,"中国坚持自卫防御核战略，始终奉行在任何时候和任何情况下都不首先使用核武器、无条件不对无核武器国家和无核武器区使用或威胁使用核武器的核政策。");
q("中国国防","m","新时代的国防观包括（ ）。",["智能国防观","全民国防观","防御国防观","综合国防观、自主国防观"],[0,1,2,3],"新时代的国防观包括：防御国防观、全民国防观、智能国防观、综合国防观、自主国防观五个方面。");
q("中国国防","s","改革开放以来，中国致力于促进世界和平，主动裁减军队员额（ ）。",["100万","30万","400余万","200万"],2,"新中国成立70年来，中国没有主动挑起过任何一场战争和冲突。改革开放以来，中国主动裁减军队员额400余万。");
q("中国国防","s","我国国防的指导思想强调贯彻习近平强军思想，坚持（ ），贯彻新时代军事战略方针。",["积极扩张战略","总体国家安全观","国家利益至上","单一军事安全"],1,"我国国防的指导思想：坚持以马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想为指导，贯彻习近平强军思想，坚持总体国家安全观，贯彻新时代军事战略方针。");
q("中国国防","s","中国军队坚持（ ）的安全观，营造平等互信、公平正义、共建共享的安全格局。",["开放、包容、互利、共赢","平等、互鉴、对话、包容","共同、综合、开放、互鉴","共同、综合、合作、可持续"],3,"《新时代的中国国防》白皮书指出：中国军队坚持共同、综合、合作、可持续的安全观，秉持正确义利观，积极参与全球安全治理体系改革。");
q("中国国防","s","新时代中国国防的世界意义是（ ）。",["服务构建人类命运共同体","干预他国内政","谋求世界霸权","建立军事同盟"],0,"服务构建人类命运共同体，是新时代中国国防的世界意义。");
q("中国国防","j","企业的国防义务仅指依法服兵役。",["错误","正确"],0,"错误。企业事业组织应当按照国家规定在与国防密切相关的建设项目中贯彻国防要求，依法保障国防建设和军事行动的需要；车站、港口、机场、道路等交通设施的管理、运营单位应当为军人和军用车辆、船舶的通行提供优先服务。服兵役是公民的义务。");
q("中国国防","s","清朝后期，主管国防事务的机构由总理衙门改为（ ）。",["兵部","陆军部","外务部","军机处"],2,"1840年以前清朝最高军事决策和领导机构是议政王大臣会议、兵部和军机处。鸦片战争后实施“洋务新政”，成立总理衙门主管国防，后改为外务部。");

q("武装力量","s","中华人民共和国的武装力量受（ ）领导。",["中国共产党","国家主席","国务院","全国人大"],0,"《国防法》第二十一条规定：中华人民共和国的武装力量受中国共产党领导。中国人民解放军必须置于中国共产党的绝对领导之下。");

q("武装力量","s","中国人民解放军诞生于（ ）。",["1927年8月1日","1949年10月1日","1929年12月28日","1927年9月9日"],0,"中国人民解放军诞生于1927年8月1日的南昌起义，是中国武装力量的骨干，是抵抗侵略、保卫祖国、维护国家主权和安全的主要力量。");
q("武装力量","s","中华人民共和国实行以（ ）为主体的志愿兵役与义务兵役相结合的兵役制度。",["职业兵役","世袭兵役","志愿兵役","义务兵役"],2,"中华人民共和国实行以志愿兵役为主体的志愿兵役与义务兵役相结合的兵役制度。");

q("毛概与中特","s","毛泽东思想的活的灵魂是（ ）。",["全心全意为人民服务","两个务必","惩前毖后、治病救人","实事求是、群众路线、独立自主"],3,"毛泽东思想活的灵魂：实事求是、群众路线、独立自主。实事求是是精髓，群众路线是党的根本工作路线，独立自主、自力更生是中国革命和建设的基本立足点。");
q("毛概与中特","m","标志毛泽东思想开始萌芽的代表著作有（ ）。",["《湖南农民运动考察报告》","《国民革命与农民运动》","《中国社会各阶级的分析》","《星星之火，可以燎原》"],[0,1,2],"毛泽东思想开始萌芽（1921年建党到1927年大革命失败）代表著作：《中国社会各阶级的分析》《湖南农民运动考察报告》《国民革命与农民运动》。《星星之火，可以燎原》是初步形成时期的著作。");
q("毛概与中特","m","标志毛泽东思想初步形成的代表著作有（ ）。",["《反对本本主义》","《中国的红色政权为什么能够存在？》","《井冈山的斗争》","《星星之火，可以燎原》"],[0,1,2,3],"初步形成时期（1927年大革命失败到1935年遵义会议）：“农村包围城市、武装夺取政权”革命道路理论的提出标志着毛泽东思想初步形成，代表著作有《中国的红色政权为什么能够存在？》《井冈山的斗争》《星星之火，可以燎原》《反对本本主义》。");

q("毛概与中特","s","群众路线是党的根本工作路线，其内涵是（ ）。",["谦虚谨慎、不骄不躁、艰苦奋斗","一切为了群众，一切依靠群众，从群众中来，到群众中去","理论联系实际","惩前毖后、治病救人"],1,"群众路线是党的根本工作路线，内涵是一切为了群众，一切依靠群众，从群众中来，到群众中去。坚持群众观点是中国共产党同一切剥削阶级政党的根本区别。");
q("毛概与中特","s","完整提出新民主主义革命总路线的著作是（ ）。",["《〈共产党人〉发刊词》","《在晋绥干部会议上的讲话》","《新民主主义论》","《论联合政府》"],1,"毛泽东在《在晋绥干部会议上的讲话》中完整提出新民主主义革命总路线：无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命。");

q("毛概与中特","m","新民主主义革命的动力包括（ ）。",["城市小资产阶级","无产阶级","民族资产阶级","农民阶级"],[0,1,2,3],"新民主主义革命的动力包括无产阶级、农民阶级、城市小资产阶级和民族资产阶级。其中农民阶级是主力军，新民主主义革命的实质是党领导下的农民革命。");
q("毛概与中特","s","新民主主义革命的经济纲领中，（ ）是新民主主义革命的主要内容。",["发展民族经济","没收官僚资产阶级的垄断资本归新民主主义的国家所有","没收封建地主阶级的土地归农民所有","保护民族工商业"],2,"经济纲领：没收封建地主阶级的土地归农民所有、没收官僚资产阶级的垄断资本归新民主主义的国家所有、保护民族工商业。其中没收封建地主阶级的土地归农民所有是新民主主义革命的主要内容。");
q("毛概与中特","s","过渡时期总路线可以概括为“一化三改”，其中总路线的主体是（ ）。",["对资本主义工商业的社会主义改造","社会主义工业化","对手工业的社会主义改造","对农业的社会主义改造"],1,"过渡时期总路线：要在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、手工业和资本主义工商业的社会主义改造（即“一化三改”）。社会主义工业化是总路线的主体。");
q("毛概与中特","s","（ ）的基本完成，标志着中国阶级剥削制度的结束和社会主义制度在中国的基本确立。",["抗美援朝","土地改革","镇压反革命","三大改造"],3,"1956年三大改造的基本完成，标志着中国阶级剥削制度的结束和社会主义制度在中国的基本确立，中国从新民主主义社会进入社会主义初级阶段。");
q("毛概与中特","s","邓小平理论的主题是（ ）。",["什么是社会主义、怎样建设社会主义","建设什么样的党、怎样建设党","实现什么样的发展、怎样发展","新时代坚持和发展什么样的中国特色社会主义"],0,"邓小平理论的主题：什么是社会主义、怎样建设社会主义。");

q("毛概与中特","m","1980年首批建立的四个经济特区是（ ）。",["深圳","汕头","厦门","珠海"],[0,1,2,3],"1980年，党中央、国务院决定将“出口特区”改名为“经济特区”，首批建立的四个经济特区是深圳、珠海、汕头和厦门。");
q("毛概与中特","s","“三个代表”重要思想所要回答和解决的重大问题是（ ）。",["实现什么样的发展、怎样发展","建设什么样的社会主义现代化强国","什么是社会主义、怎样建设社会主义","建设什么样的党、怎样建设党"],3,"“三个代表”重要思想回答和解决“建设什么样的党、怎样建设党”的问题。关键在坚持与时俱进，核心在坚持党的先进性，本质在坚持执政为民。");
q("毛概与中特","s","科学发展观创造性地回答了新形势下（ ）这一重大问题。",["建设什么样的党、怎样建设党","实现什么样的发展、怎样发展","新时代坚持和发展什么样的中国特色社会主义","什么是社会主义、怎样建设社会主义"],1,"科学发展观创造性地回答了新形势下“实现什么样的发展、怎样发展”这一重大问题。");
q("毛概与中特","s","中国特色社会主义进入新时代，我国社会主要矛盾已经转化为（ ）。",["人民日益增长的物质文化需要同落后的社会生产之间的矛盾","经济基础与上层建筑的矛盾","人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","无产阶级与资产阶级的矛盾"],2,"中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。");
q("毛概与中特","m","中国特色社会主义事业总体布局“五位一体”包括（ ）。",["政治建设、文化建设","社会建设","生态文明建设","经济建设"],[0,1,2,3],"“五位一体”：经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体。");

q("毛概与中特","m","四个伟大是指（ ）。",["伟大梦想","伟大工程","伟大斗争","伟大事业"],[0,1,2,3],"四个伟大：伟大斗争、伟大工程、伟大事业、伟大梦想，其中起决定性作用的是党的建设新的伟大工程。");
q("毛概与中特","s","习近平新时代中国特色社会主义思想是（ ）。",["毛泽东思想的简单延续","当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华","中国特色社会主义理论体系的开篇之作","马克思列宁主义在中国的简单运用"],1,"习近平新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化时代化新的飞跃。");
q("毛概与中特","m","中国式现代化包括（ ）的现代化。",["物质文明和精神文明相协调","人口规模巨大","人与自然和谐共生、走和平发展道路","全体人民共同富裕"],[0,1,2,3],"中国式现代化：人口规模巨大的现代化、全体人民共同富裕的现代化、物质文明和精神文明相协调的现代化、人与自然和谐共生的现代化、走和平发展道路的现代化。");
q("毛概与中特","s","中国式现代化的本质特征，也是区别于西方现代化的显著标志的是（ ）。",["全体人民共同富裕","人口规模巨大","走和平发展道路","物质文明和精神文明相协调"],0,"全体人民共同富裕的现代化是中国式现代化的本质特征，也是区别于西方现代化的显著标志。");
q("毛概与中特","s","高质量发展是全面建设社会主义现代化国家的首要任务，发展经济的着力点放在（ ）。",["虚拟经济","实体经济","房地产业","金融业"],1,"坚持把发展经济的着力点放在实体经济上。");
q("毛概与中特","s","新质生产力是（ ）起主导作用，具有高科技、高效能、高质量特征的先进生产力质态。",["资源消耗","传统产能","投资","创新"],3,"新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有高科技、高效能、高质量特征，符合新发展理念的先进生产力质态。");
q("毛概与中特","m","全面建设社会主义现代化国家的基础性、战略性支撑包括（ ）。",["人才","教育","资本","科技"],[0,1,3],"教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。必须坚持科技是第一生产力、人才是第一资源、创新是第一动力。");

q("政经","m","商品的二因素包括（ ）。",["价格","价值","使用价值","交换价值"],[1,2],"商品是用来交换的能满足人们某种需要的劳动产品。商品的二因素：使用价值（自然属性）和价值（社会属性、本质属性）。");
q("政经","s","凝结在商品中的无差别的一般人类劳动形成商品的（ ）。",["价值","价格","交换价值","使用价值"],0,"价值是凝结在商品中的无差别的一般人类劳动，是商品的社会属性、本质属性。使用价值是商品能够满足人们某种需要的属性，即商品的有用性，是自然属性。");
q("政经","m","劳动二重性包括（ ）。",["具体劳动","抽象劳动","社会劳动","私人劳动"],[0,1],"劳动二重性：具体劳动（各种形式的有用劳动，具体劳动和自然物质共同构成使用价值的源泉）和抽象劳动（无差别的人类劳动，抽象劳动是价值的唯一源泉）。");
q("政经","m","货币的职能包括（ ）。",["贮藏手段、世界货币","流通手段","支付手段","价值尺度"],[0,1,2,3],"货币职能：价值尺度（标价、定价、询价）、流通手段（一手交钱，一手交货）、支付手段（工资、租金、税款、延期支付，钱货分离）、贮藏手段（足值的金银）、世界货币。");
q("政经","s","工资、租金、税款、延期支付体现的货币职能是（ ）。",["流通手段","贮藏手段","价值尺度","支付手段"],3,"支付手段的常见形式：工资、租金、税款、延期支付，其特点是钱货分离。");
q("政经","s","数字人民币是中国人民银行发行的（ ）。",["商业票据","虚拟货币","数字形式的法定货币","电子支付券"],2,"数字人民币是中国人民银行发行的数字形式的法定货币，由指定运营机构参与运营，与实物人民币等价，具有价值特征和法偿性。");
q("政经","s","如果纸币的发行量超过了流通中所需要的金属货币量，会引起（ ）。",["物价不变","货币制度崩溃","纸币升值、物价下跌","纸币贬值、物价上涨，即通货膨胀"],3,"纸币的发行量要以流通中所需的金属货币量为限度：超过则纸币贬值、物价上涨，即通货膨胀；少于则纸币升值、物价下跌，即通货紧缩。");
q("政经","s","马克思把商品转换为货币称为（ ）。",["“商品的惊险的跳跃”","“资本的总公式”","“价值的革命”","“流通的奇迹”"],0,"马克思把商品转换为货币称为“商品的惊险的跳跃”，“这个跳跃如果不成功，摔坏的不是商品，但一定是商品占有者”。");
q("政经","s","单位商品的价值量与社会必要劳动时间（ ）。",["成反比","有时成正比有时成反比","成正比","无关"],2,"单位商品价值量：与社会必要劳动时间成正比，与社会劳动生产率成反比，与个别劳动时间、个别劳动生产率无关。");
q("政经","m","价值规律的作用包括（ ）。",["刺激商品生产者改进技术，改善经营管理，提高劳动生产率","调节生产资料和劳动力在各生产部门的分配","促进商品生产者在竞争中的优胜劣汰","决定商品价格"],[0,1,2],"价值规律的作用：调节生产资料和劳动力在各生产部门的分配；刺激商品生产者改进技术、改善经营管理、提高劳动生产率；促进优胜劣汰。价值规律不能决定商品价格，价格由价值决定并受供求影响围绕价值上下波动。");
q("政经","s","剩余价值是雇佣工人所创造的并被资本家无偿占有的（ ）的那部分价值。",["超过劳动力价值","全部劳动","必要劳动","相当于劳动力价值"],0,"剩余价值是雇佣工人所创造的并被资本家无偿占有的超过劳动力价值的那部分价值。工人的剩余劳动是剩余价值的唯一源泉。");
q("政经","s","剩余价值率的公式是（ ）。",["m′=v/m","m′=m/c","m′=m/v","m′=c/v"],2,"剩余价值率是剩余价值和可变资本的比率，用m′表示剩余价值率，m表示剩余价值，v表示可变资本，则公式为m′=m/v。");
q("政经","s","在必要劳动时间不变的条件下，通过延长工作时间所获得的剩余价值是（ ）。",["相对剩余价值","绝对剩余价值","平均剩余价值","超额剩余价值"],1,"绝对剩余价值是在必要劳动时间不变的条件下，通过延长工作时间所获得的剩余价值；相对剩余价值是在工作时间不变的条件下，由于缩短必要劳动时间而相对延长剩余劳动时间所生产的剩余价值。");

q("文史知识","s","“君者，舟也；庶人者，水也。水则载舟，水则覆舟”出自（ ）。",["孟子","孔子","韩非","荀子"],3,"荀子提出“君舟民水”，主张性恶论，提倡礼法并用，“制天命而用之”。");
q("文史知识","s","主张“无为而治”的思想流派是（ ）。",["法家","道家","儒家","墨家"],1,"老子主张“无为而治”，认为“道”是宇宙的本原，属客观唯心主义，有朴素辩证法思想（祸兮福之所倚）。庄子追求“逍遥游”。");
q("文史知识","s","法家思想的集大成者韩非提倡（ ）。",["仁政","兼爱非攻","法、术、势相结合","无为而治"],2,"韩非提倡法治、法不阿贵，将“法、术、势”三者相结合，提倡君主专制中央集权，强调“世异则事异，事异则备变”。");
q("文史知识","s","“兼爱”“非攻”的思想出自（ ）。",["道家","法家","儒家","墨家"],3,"墨子思想：兼爱、非攻、尚贤，提倡节用。《墨经》中的“光学八条”是世界上最早记载“小孔成像”的著作。战国时期儒家与墨家并称显学。");
q("文史知识","s","“知彼知己，百战不殆”出自（ ），孙武被后世尊称为“兵圣”。",["《孙子兵法》","《孙膑兵法》","《六韬》","《吴子兵法》"],0,"《孙子兵法》是世界上最早的兵书，作者孙武被尊称为“兵圣”。");
q("文史知识","s","提出“罢黜百家，独尊儒术”“天人感应”的思想家是（ ）。",["王阳明","朱熹","董仲舒","韩愈"],2,"西汉董仲舒提出君权神授、天人感应、“三纲”“五常”、“罢黜百家，独尊儒术”、“大一统”学说，著作《春秋繁露》。");
q("文史知识","s","提出“存天理，灭人欲”的思想家是（ ）。",["程颐","朱熹","陆九渊","王阳明"],1,"南宋朱熹是理学的集大成者，提出“存天理，灭人欲”，编撰《四书章句集注》。");
q("文史知识","s","主张“心外无物，心外无理”“致良知”“知行合一”的是（ ）。",["朱熹","张载","顾炎武","王阳明"],3,"明代王阳明（王守仁）主张“心外无物，心外无理”，提出致良知、知行合一，著作《传习录》。");
q("文史知识","s","朱熹编撰《四书章句集注》，把（ ）定为“四书”。",["《论语》《孟子》《荀子》《春秋》","《大学》《论语》《孟子》《荀子》","《诗》《书》《礼》《易》","《大学》《中庸》《论语》《孟子》"],3,"四书：《大学》《中庸》《论语》《孟子》。五经：《诗经》《尚书》《礼记》《周易》《春秋》。");
q("文史知识","s","“四书五经”中的《诗经》是我国（ ）。",["第一部纪传体史书","第一部字典","第一部军事著作","第一部诗歌总集"],3,"《诗经》是我国第一部诗歌总集，也是现实主义诗歌的源头，由孔子删定，共305篇（另有6篇笙诗有目无辞，故称“诗三百”）。");

/* ===== 文史知识（古代文学） ===== */
q("文史知识","s","《诗经》的内容分为风、雅、颂，其中“颂”是（ ）。",["正声雅乐","宗庙祭祀的乐歌","宫廷宴饮之乐","各地的歌谣"],1,"《风》是各地的歌谣，《雅》是正声雅乐，《颂》是宗庙祭祀的乐歌。表现手法：赋（平铺直叙）、比（比喻）、兴（顾左右而言他）。");
q("文史知识","s","我国第一部浪漫主义诗歌总集是（ ）。",["《古诗十九首》","《诗经》","《乐府诗集》","《楚辞》"],3,"屈原采用楚国方言、利用南方民歌形式创造出“楚辞”新诗体，代表作《离骚》《天问》。刘向编辑成作品集《楚辞》，是我国第一部浪漫主义诗歌总集。");
q("文史知识","s","“汉赋四大家”不包括（ ）。",["扬雄","班固","贾谊","司马相如"],2,"汉赋四大家：司马相如（《子虚赋》《上林赋》）、扬雄、班固（《两都赋》）、张衡。");
q("文史知识","s","我国文学史上第一部长篇叙事诗是（ ）。",["《琵琶行》","《长恨歌》","《孔雀东南飞》","《木兰诗》"],2,"《孔雀东南飞》是我国文学史上第一部长篇叙事诗，与北朝《木兰诗》合称“乐府双璧”。");
q("文史知识","s","我国第一首完整的山水诗是（ ）。",["王维《山居秋暝》","谢灵运《登池上楼》","曹操《观沧海》","陶渊明《饮酒》"],2,"曹操《观沧海》是我国第一首完整的山水诗；曹丕《燕歌行》是我国第一首完整的七言诗。");
q("文史知识","s","田园诗派的创始人是（ ）。",["陶渊明","王维","谢灵运","孟浩然"],0,"东晋陶渊明自号五柳先生，世称靖节先生，是田园诗派创始人，代表作《饮酒》《桃花源记》。谢灵运是山水诗派创始人。");
q("文史知识","m","“初唐四杰”包括（ ）。",["卢照邻","王勃","杨炯","骆宾王"],[0,1,2,3],"初唐四杰：王勃、杨炯、卢照邻、骆宾王。王勃代表作《滕王阁序》《送杜少府之任蜀州》。");
q("文史知识","s","被称为“诗佛”的唐代诗人是（ ）。",["王维","白居易","杜甫","李白"],0,"王维，字摩诘，被称为“诗佛”，代表作《山居秋暝》《九月九日忆山东兄弟》《使至塞上》。");
q("文史知识","s","被后人誉为“诗仙”的伟大浪漫主义诗人是（ ）。",["李白","李商隐","白居易","杜甫"],0,"李白，字太白，号青莲居士，被誉为“诗仙”，代表作《将进酒》《蜀道难》《行路难》。杜甫被称为“诗圣”，其诗反映社会现实，被称为“诗史”。");
q("文史知识","s","杜甫的“三吏三别”中，“三别”不包括（ ）。",["《垂老别》","《石壕吏》","《新婚别》","《无家别》"],3,"“三吏”：《新安吏》《石壕吏》《潼关吏》；“三别”：《新婚别》《无家别》《垂老别》。");
q("文史知识","s","唐代诗人白居易被称为（ ）。",["“诗魔”","“诗佛”","“诗圣”","“诗仙”"],0,"白居易，字乐天，号香山居士，被称为“诗魔”，与元稹共同倡导新乐府运动，世称“元白”，代表作《长恨歌》《琵琶行》《卖炭翁》。");
q("文史知识","s","“小李杜”是指（ ）。",["李白和杜甫","李商隐和李贺","杜牧和李商隐","杜牧和李贺"],2,"晚唐“小李杜”：杜牧（《泊秦淮》《赤壁》）、李商隐（《无题》《锦瑟》》）。");
q("文史知识","m","宋词豪放派的代表人物包括（ ）。",["柳永","苏轼","李清照","辛弃疾"],[1,3],"豪放派：苏轼（《念奴娇·赤壁怀古》）、辛弃疾（《破阵子·为陈同甫赋壮词以寄之》）。婉约派：柳永、李清照。");
q("文史知识","s","辛弃疾与（ ）合称“苏辛”。",["柳永","苏轼","陆游","李清照"],1,"辛弃疾与苏轼合称“苏辛”，与李清照并称“济南二安”。");
q("文史知识","m","“唐宋八大家”包括（ ）。",["王安石、曾巩","韩愈、柳宗元","欧阳修","苏洵、苏轼、苏辙"],[0,1,2,3],"唐宋八大家：韩愈（之首）、柳宗元、欧阳修、苏洵、苏轼、苏辙、王安石、曾巩。韩愈与柳宗元并称“韩柳”。");
q("文史知识","m","“元曲四大家”包括（ ）。",["郑光祖","马致远","关汉卿","白朴"],[0,1,2,3],"元曲四大家：关汉卿（《窦娥冤》）、马致远（《汉宫秋》）、郑光祖（《倩女离魂》）、白朴（《梧桐雨》）。王实甫《西厢记》也很有名。");
q("文史知识","s","汤显祖“临川四梦”中，又名《还魂记》的是（ ）。",["《邯郸记》","《紫钗记》","《南柯记》","《牡丹亭》"],3,"汤显祖“临川四梦”：《还魂记》（《牡丹亭》，杜丽娘、柳梦梅）、《紫钗记》《邯郸记》《南柯记》。");
q("文史知识","s","清代孔尚任《桃花扇》的女主人公是（ ）。",["杜丽娘","李香君","崔莺莺","杨贵妃"],1,"洪昇《长生殿》写杨贵妃、唐玄宗；孔尚任《桃花扇》写李香君、侯方域。");
q("文史知识","s","我国古代第一部长篇章回体小说是（ ）。",["《红楼梦》","《西游记》","《水浒传》","《三国演义》"],3,"《三国演义》罗贯中著，是我国古代第一部长篇章回体小说。");
q("文史知识","s","我国第一部以农民起义为题材的长篇小说是（ ）。",["《水浒传》","《聊斋志异》","《西游记》","《红楼梦》"],0,"《水浒传》施耐庵著，是我国第一部以农民起义为题材的长篇小说。");
q("文史知识","s","清代蒲松龄的《聊斋志异》是（ ）。",["我国第一部长篇章回体小说","我国古代的讽刺小说","我国古代优秀的短篇小说集","晚清四大谴责小说之一"],2,"《儒林外史》吴敬梓著，是我国古代的讽刺小说。《聊斋志异》蒲松龄著，是优秀的短篇小说集。");
q("文史知识","m","晚清四大谴责小说包括（ ）。",["《老残游记》","《孽海花》","《官场现形记》","《二十年目睹之怪现状》"],[0,1,2,3],"晚清四大谴责小说：李宝嘉《官场现形记》、吴沃尧《二十年目睹之怪现状》、刘鹗《老残游记》、曾朴《孽海花》。");

/* ===== 文史知识（医学、史书） ===== */
q("文史知识","s","创立“望闻问切”四诊法、被誉为“脉学之宗”的是（ ）。",["张仲景","华佗","孙思邈","扁鹊"],3,"扁鹊（春秋战国）创立“望闻问切”四诊法，被誉为“脉学之宗”。");
q("文史知识","s","发明麻沸散和五禽戏，被誉为“外科鼻祖”的是（ ）。",["李时珍","扁鹊","华佗","张仲景"],2,"东汉华佗被誉为“外科鼻祖”，发明麻沸散、五禽戏（虎、鹿、熊、猿、鸟）。");
q("文史知识","s","被后世尊为“医圣”的是（ ），其代表作《伤寒杂病论》确立了辨证论治原则。",["李时珍","华佗","张仲景","孙思邈"],2,"东汉张仲景被誉为“医圣”，代表作《伤寒杂病论》确立了辨证论治原则，最早记载舌下给药、胸外心脏按压和人工呼吸法。");
q("文史知识","s","被后世尊为“药王”的是（ ）。",["扁鹊","张仲景","华佗","孙思邈"],3,"唐代孙思邈被誉为“药王”，代表作《千金方》，是中国最早的临床百科全书。");
q("文史知识","s","世界最早的法医学著作是（ ）。",["《本草纲目》","《脉经》","《千金方》","《洗冤集录》"],3,"南宋宋慈《洗冤集录》是世界最早的法医学著作。");
q("文史知识","s","李时珍的《本草纲目》被誉为（ ）。",["“东方药物巨典”以外的任何称号","第一部临床百科全书","“东方医药巨典”","“最早的药物学专著”"],2,"明代李时珍《本草纲目》被誉为“东方医药巨典”。《神农本草经》是中国古代第一部药物学专著。");
q("文史知识","s","我国第一部诗歌总集由孔子删定，我国第一部编年体史书也由孔子修订，它是（ ）。",["《国语》","《尚书》","《左传》","《春秋》"],3,"《春秋》原本为鲁国史书，孔子晚年修订，是我国现存最早的编年体史书。");
q("文史知识","s","我国第一部国别体史书是（ ）。",["《战国策》","《国语》","《史记》","《左传》"],1,"《国语》相传左丘明著，是我国第一部国别体史书。");
q("文史知识","s","鲁迅评价为“史家之绝唱，无韵之离骚”的史书是（ ）。",["《三国志》","《资治通鉴》","《史记》","《汉书》"],2,"西汉司马迁《史记》是我国第一部纪传体通史，体例为本纪、世家、列传、表、书，鲁迅评“史家之绝唱，无韵之离骚”。");
q("文史知识","s","我国第一部纪传体断代史是（ ）。",["《史记》","《三国志》","《后汉书》","《汉书》"],3,"东汉班固《汉书》是我国第一部纪传体断代史，有世界公认最早关于太阳黑子的记录。");
q("文史知识","s","宋神宗评价“鉴于往事，有资于治道”并赐名的史书是（ ）。",["《汉书》","《文献通考》","《资治通鉴》","《史记》"],2,"北宋司马光主持编纂《资治通鉴》，是我国第一部（官修）编年体通史，也是现存规模最大的编年体史书。");
q("文史知识","s","我国第一部叙事详细的编年体史书是（ ）。",["《左传》","《春秋》","《国语》","《资治通鉴》"],0,"《左传》相传左丘明著，是我国第一部叙事详细的编年体史书。");
q("文史知识","j","《三国志》记载三国时期曹魏、蜀汉、东吴的纪传体断代史，作者是西晋陈寿。",["错误","正确"],1,"正确。《三国志》与《史记》《汉书》《后汉书》合称“前四史”。");

q("文史知识","s","八国联军侵华后签订的《辛丑条约》规定赔款白银（ ），标志着中国彻底沦为半殖民地半封建社会。",["4.5亿两","2100万银元","800万两","2亿两"],0,"《辛丑条约》赔款白银4.5亿两，胁迫清政府承诺镇压反帝斗争等，标志着中国彻底沦为半殖民地半封建社会。");
q("文史知识","m","太平天国运动的重要节点包括（ ）。",["1864年天京陷落","1900年八国联军侵华","1851年1月金田起义","1856年天京事变"],[0,2,3],"太平天国运动：1851年兴（金田起义）、1856年衰（天京事变）、1864年亡（天京陷落）。动摇了清王朝封建统治，但农民阶级有局限性，不可能完成反帝反封建的历史任务。");
q("文史知识","s","太平天国运动中，提出向西方学习、进行经济政治和文化改革方案的文献是（ ）。",["《海国图志》","《四洲志》","《天朝田亩制度》","《资政新篇》"],3,"《天朝田亩制度》废除封建地主阶级土地所有制，按人口和年龄平均分配土地，属于空想无法实现。《资政新篇》是中国人最早提出的带有资本主义色彩的改革方案。");
q("文史知识","s","洋务运动的口号前期是“自强”，后期是（ ）。",["“共和”","“法治”","“求富”","“民主”"],2,"洋务运动特点是“中学为体，西学为用”。军事工业有江南机器制造总局、福州船政局；民用工业有上海轮船招商局（最早）、汉阳铁厂。甲午战争失败标志洋务运动失败。");
q("文史知识","s","洋务运动失败的根本原因是（ ）。",["缺乏资金支持","缺乏人才","未从根本上变革落后的封建制度","缺少西方支持"],2,"洋务运动只学技术不改制度，未从根本上变革落后的封建制度，这是其失败的根本原因。");
q("文史知识","s","1898年“百日维新”后，唯一被保留的新政措施是（ ）。",["设议院","京师大学堂（北大前身）","废八股","练新军"],1,"戊戌变法仅京师大学堂（北大前身）被保留，其余新政都被废除。");
q("文史知识","s","中国近代第一个资产阶级民主革命团体是1894年11月孙中山在（ ）创建的兴中会。",["东京","广州","香港","檀香山"],3,"孙中山1894年11月在檀香山创建兴中会。1905年在东京成立同盟会，是第一个全国性的资产阶级革命政党，纲领“驱除鞑虏，恢复中华，创立民国，平均地权”，后概括为民族、民权、民生三大主义。");
q("文史知识","s","1912年1月1日中华民国成立，孙中山就任临时大总统。中华民国第一部具有资产阶级共和国宪法性质的文件是（ ）。",["《天坛宪草》","《双十协定》","《钦定宪法大纲》","《中华民国临时约法》"],3,"《中华民国临时约法》是我国第一部资产阶级宪法性文献。");
q("文史知识","s","辛亥革命最重要的历史功绩是（ ）。",["实现了民族独立","结束了统治中国两千多年的封建君主专制制度，使民主共和观念深入人心","建立了社会主义国家","完成了反帝反封建的任务"],1,"辛亥革命结束了统治中国两千多年的封建君主专制制度，建立了中国历史上第一个资产阶级共和政府，使民主共和的观念开始深入人心。但未改变近代中国的社会性质，未完成反帝反封建的任务。");
q("文史知识","s","1915年，陈独秀在上海创办（ ），标志着新文化运动的兴起。",["《每周评论》","《新潮》","《湘江评论》","《青年杂志》（后改名《新青年》）"],3,"新文化运动口号是民主和科学（“德先生”“赛先生”）。鲁迅《狂人日记》是第一部白话小说。后期李大钊发表《庶民的胜利》《布尔什维主义的胜利》，马克思主义开始在中国传播。");
q("文史知识","s","五四运动的导火索是（ ）。",["《二十一条》的签订","新文化运动兴起","辛亥革命失败","巴黎和会上中国外交的失败"],3,"五四运动口号“外争主权，内除国贼”。第一阶段在北京（学生），第二阶段在上海（工人）。中国工人阶级开始登上政治舞台，标志着新民主主义革命的开端。");
q("文史知识","s","中国共产党第一次全国代表大会召开的时间是（ ）。",["1921年7月23日","1920年8月","1922年7月","1921年7月1日"],0,"中共一大于1921年7月23日在上海召开，最后一天转移到浙江嘉兴南湖的红船上。确定党的名称为“中国共产党”，选举陈独秀为中央局书记。");
q("文史知识","s","国共两党合作正式建立、革命统一战线正式形成的标志是（ ）。",["中共三大的召开","1924年国民党一大在广州召开","黄埔军校的建立","北伐战争的开始"],1,"中共三大的召开正式决定全体共产党员以个人名义加入国民党。1924年国民党一大在广州召开，标志着国共两党合作的实现和革命统一战线的正式建立。");
q("文史知识","s","黄埔军校中，任校长和政治部主任的分别是（ ）。",["廖仲恺、蒋介石","孙中山、廖仲恺","周恩来、叶剑英","蒋介石、周恩来"],3,"1924年5月，孙中山在广州黄埔建立陆军军官学校，简称“黄埔军校”。蒋介石任校长，周恩来任政治部主任。");
q("文史知识","s","1927年蒋介石发动（ ），汪精卫发动七一五反革命政变，第一次国共合作全面破裂。",["四一二反革命政变","皖南事变","中山舰事件","马日事变"],0,"1927年蒋介石发动四一二反革命政变，汪精卫发动七一五反革命政变，第一次国共合作全面破裂。");
q("文史知识","s","南昌起义发生在（ ）。",["1927年8月1日","1927年12月11日","1928年4月","1927年9月9日"],0,"南昌起义：1927年8月1日，打响了武装反抗国民党反动统治的第一枪，拉开了中国共产党独立领导武装斗争、创建人民军队和武装夺取政权的序幕。");
q("文史知识","s","秋收起义的时间是（ ）。",["1927年9月","1927年8月","1927年12月","1928年4月"],0,"秋收起义：1927年9月，起义受挫后，向敌人统治力量薄弱的农村转移。");
q("文史知识","s","中央红军长征的路线是：瑞金—强渡湘江—遵义会议—四渡赤水—南渡乌江—巧渡金沙江—强渡大渡河—飞夺泸定桥—翻越夹金山—翻越六盘山—（ ）—会宁会师—将台堡会师。",["懋功会师","甘孜会师","井冈山会师","吴起镇会师"],3,"中央红军长征1936年10月胜利结束：1936年10月9日红一、四方面军在甘肃会宁会师；10月22日红一、二方面军在将台堡胜利会师。");
q("文史知识","s","遵义会议召开于（ ）。",["1927年8月","1935年1月","1937年8月","1929年12月"],1,"遵义会议1935年1月召开，是中国共产党历史上一个生死攸关的转折点，事实上确立了毛泽东在党中央和红军的领导地位。");
q("文史知识","s","九一八事变发生于（ ）。",["1931年9月18日","1937年7月7日","1935年12月9日","1936年12月12日"],0,"九一八事变：1931年9月18日，是中国人民抗日战争的起点，九一八事变后东北沦陷。");
q("文史知识","s","1936年12月，张学良、杨虎城发动（ ），逼蒋抗日。",["西安事变","华北事变","福建事变","两广事变"],0,"西安事变：1936年12月，张学良、杨虎城逼蒋抗日，对促成以国共两党合作为基础的抗日民族统一战线的建立起到了重要作用。");
q("文史知识","s","标志着中国全民族抗战开始的是（ ）。",["七七事变","九一八事变","八一三事变","西安事变"],0,"七七事变：1937年7月7日，中华民族全面抗战的开始。八一三事变后淞沪会战开始。");
q("文史知识","s","南京大屠杀死难者国家公祭日是每年的（ ）。",["9月18日","12月13日","12月4日","9月3日"],1,"1937年12月13日南京陷落。2014年起，将每年12月13日确定为南京大屠杀死难者国家公祭日。");
q("文史知识","s","全民族抗战以来中国军队取得的第一次胜利是（ ）。",["武汉会战","平型关大捷","台儿庄战役","百团大战"],1,"平型关大捷是全民族抗战以来中国军队的第一次胜利。台儿庄战役是正面战场最大规模的胜利。");
q("文史知识","s","八路军与日军在华北进行的规模最大、持续时间最长的战役是（ ）。",["忻口会战","台儿庄战役","百团大战","平型关大捷"],2,"百团大战是抗日战争中八路军与日军在华北发生的规模最大、持续时间最长的战役。");
q("文史知识","s","中国人民抗日战争胜利纪念日是每年的（ ）。",["9月2日","9月3日","9月18日","8月15日"],1,"1945年8月15日日本宣布无条件投降，9月2日日本正式签署投降书。2014年起，将每年9月3日确定为中国人民抗日战争胜利纪念日。");
q("文史知识","m","中国人民抗日战争胜利的原因包括（ ）。",["建立抗日民族统一战线，实行全民族抗战","世界反法西斯力量的支持","国际联盟的直接参战","中国共产党在全民族抗战中起到了中流砥柱的作用"],[0,1,3],"抗战胜利原因：①中国共产党发挥中流砥柱作用；②建立抗日民族统一战线，全民族抗战是根本原因；③与世界反法西斯力量的支持分不开。");
q("文史知识","s","1945年10月10日，国共双方签署的《政府与中共代表会谈纪要》又称（ ）。",["《停战协定》","《共同纲领》","《国内和平协定》","“双十协定”"],3,"重庆谈判签署“双十协定”。1946年国民党进攻中原解放区，全面内战爆发。");
q("文史知识","s","解放战争时期，揭开战略反攻序幕的是（ ）。",["辽沈战役","淮海战役","渡江战役","刘伯承、邓小平率解放军主力挺进大别山"],3,"1947年刘邓大军挺进大别山，标志着战略反攻的开始。");
q("文史知识","m","解放战争三大战役包括（ ）。",["淮海战役","辽沈战役","平津战役","渡江战役"],[0,1,2],"三大战役（1948年9月至1949年1月）：辽沈、淮海、平津。渡江战役1949年4月21日发起，4月23日占领南京，国民党在大陆的统治结束。");
q("文史知识","s","抗美援朝战争中，中国人民志愿军于（ ）进入朝鲜战场。",["1950年10月19日","1951年","1950年10月25日","1950年6月25日"],0,"1950年10月19日，中国人民志愿军在彭德怀司令员兼政治委员率领下进入朝鲜战场，10月25日打响入朝第一仗（温井之战）。");
q("文史知识","s","魏巍的抗美援朝名作是（ ）。",["《我们会见了彭德怀司令员》","《三千里江山》","《谁是最可爱的人》","《上甘岭》"],2,"杨朔《三千里江山》；魏巍《谁是最可爱的人》；巴金《我们会见了彭德怀司令员》。电影《英雄儿女》《上甘岭》《长津湖》；歌曲《我的祖国》。");
q("文史知识","s","在抗美援朝第二次战役中，抱起炸药包与敌人同归于尽的战斗英雄是（ ）。",["杨育才","黄继光","邱少云","杨根思"],3,"杨根思在长津湖地区（第二次战役东线）连续打退美军八次进攻，抱起炸药包与敌人同归于尽，被授予“特级战斗英雄”称号。");

q("世界史","m","四大文明古国包括（ ）。",["古印度","古巴比伦","古埃及","中国"],[0,1,2,3],"四大文明古国：古埃及（约公元前3500年，尼罗河流域，象形文字、金字塔、狮身人面像、太阳历）；古巴比伦（两河流域，楔形文字、空中花园、《汉谟拉比法典》）；古印度（印度河流域，种姓制度）；中国（黄河流域，甲骨文）。");
q("世界史","s","现存古代第一部比较完备的成文法典是（ ）。",["《十二铜表法》","《查士丁尼法典》","《汉谟拉比法典》","《法国民法典》"],2,"《汉谟拉比法典》是古巴比伦国王汉谟拉比颁布的，是现存古代第一部比较完备的成文法典。");
q("世界史","s","古埃及的文字是（ ）。",["腓尼基文字","楔形文字","甲骨文","象形文字"],3,"古埃及使用象形文字，建筑成就有金字塔、狮身人面像，历法为太阳历。");
q("世界史","s","古希腊哲学“三杰”包括（ ）。",["泰勒斯、毕达哥拉斯、赫拉克利特","芝诺、伊壁鸠鲁、德谟克利特","但丁、彼特拉克、薄伽丘","苏格拉底、柏拉图、亚里士多德"],3,"古希腊三杰：苏格拉底、柏拉图、亚里士多德。最具代表性的城邦是雅典与斯巴达。");
q("世界史","s","公元前509年罗马城发展成共和国，由贵族组成的（ ）掌握统治实权。",["元老院","保民官","公民大会","执政官"],0,"罗马共和国时代由贵族组成的元老院掌握统治实权。公元前27年屋大维独揽大权，罗马由共和国转变为帝国。");
q("世界史","s","古罗马第一部成文法典是（ ）。",["《法国民法典》","《汉谟拉比法典》","《十二铜表法》","《查士丁尼法典》"],2,"《十二铜表法》是古罗马的第一部成文法典，是罗马法发展史上的重要里程碑。");
q("世界史","s","476年，西罗马帝国被（ ）所灭。",["波斯人","奥斯曼人","日耳曼人","阿拉伯人"],2,"395年罗马帝国分裂为东西两部分；476年西罗马帝国被日耳曼人所灭；东罗马帝国延续至1453年，为奥斯曼帝国所灭。");
q("世界史","s","基督教的诞生地是今以色列、巴勒斯坦和约旦地区，创始人是（ ）。",["耶稣","保罗","释迦牟尼","穆罕默德"],0,"基督教公元1世纪诞生于今以色列、巴勒斯坦和约旦地区，创始人耶稣，经典《圣经》。16世纪宗教改革后分为天主教、东正教和新教三个教派。");
q("世界史","s","佛教创立于公元前6世纪，诞生地在古印度北部迦毗罗卫城（今尼泊尔境内），创始人是（ ）。",["穆罕默德","阿育王","乔达摩·悉达多（释迦牟尼）","耶稣"],2,"佛教创始人乔达摩·悉达多，被尊称为“释迦牟尼”，思想是众生平等、寻求解脱。");
q("世界史","s","伊斯兰教于公元7世纪初诞生于阿拉伯半岛的麦加城，创始人是（ ），经典著作《古兰经》。",["琐罗亚斯德","释迦牟尼","耶稣","穆罕默德"],3,"622年穆罕默德在麦地那建立政教合一的国家，对阿拉伯半岛的统一起了促进作用。");
q("世界史","s","发现美洲大陆的意大利航海家是（ ）。",["达·伽马","麦哲伦","迪亚士","哥伦布"],3,"哥伦布发现美洲大陆。麦哲伦船队完成了史上第一次环球航行。新航路开辟（14—17世纪中期）被称为“人类地理的大发现”。");
q("世界史","s","文艺复兴的核心思潮是（ ）。",["人文主义","浪漫主义","理性主义","神权主义"],0,"文艺复兴是14世纪到17世纪初发生在欧洲的新兴资产阶级反封建的一次思想文化运动，兴起于14世纪的意大利，核心是人文主义。");
q("世界史","s","被誉为“人文主义之父”的是（ ）。",["薄伽丘","但丁","彼特拉克","莎士比亚"],2,"彼特拉克最先提出以“人的学问”代替“神的学问”，被称为“人文主义之父”。但丁是文艺复兴的先驱，《神曲》分“地狱”“炼狱”“天堂”三部分。");
q("世界史","m","文艺复兴“美术三杰”包括（ ）。",["拉斐尔","彼特拉克","米开朗琪罗","达·芬奇"],[0,2,3],"美术三杰：达·芬奇（《蒙娜丽莎》《最后的晚餐》）、米开朗琪罗（《大卫》）、拉斐尔（《西斯廷圣母》）。");
q("世界史","m","莎士比亚的“四大悲剧”包括（ ）。",["《奥赛罗》","《麦克白》","《哈姆雷特》","《李尔王》"],[0,1,2,3],"莎士比亚被誉为“英国戏剧之父”，四大悲剧：《哈姆雷特》《奥赛罗》《李尔王》《麦克白》；四大喜剧：《威尼斯商人》《仲夏夜之梦》《第十二夜》《皆大欢喜》。");
q("世界史","s","揭开英国资产阶级革命序幕的事件是（ ）。",["1688年“光荣革命”","1640年查理一世召开议会","英国内战爆发","1689年颁布《权利法案》"],1,"1640年查理一世召开议会，征税法案被拒，揭开英国资产阶级革命序幕。1688年“光荣革命”革命完成，1689年颁布《权利法案》，英国确立君主立宪制。");

q("世界史","s","法国大革命爆发于（ ），巴黎市民攻占巴士底狱。",["1799年11月9日","1804年12月2日","1789年7月14日","1776年7月4日"],2,"1789年7月14日攻占巴士底狱，随后颁布《人权宣言》。1804年12月拿破仑称帝建立法兰西第一帝国，同年颁布《法国民法典》，是世界上第一部资本主义民法典。");

q("世界史","s","第一次世界大战的导火索是（ ）。",["九一八事变","珍珠港事件","萨拉热窝事件","德国入侵波兰"],2,"一战根本原因是帝国主义国家之间政治经济发展不平衡。交战双方：同盟国（德、奥、意）vs协约国（英、法、俄）。凡尔登战役被称为“凡尔登绞肉机”。");

q("世界史","s","第二次世界大战的转折点是（ ）。",["中途岛海战","斯大林格勒战役","诺曼底登陆","阿拉曼战役"],1,"1943年斯大林格勒战役胜利是苏德战场乃至二战的转折点。1942年中途岛海战是太平洋战场转折，阿拉曼战役是北非战场转折。");

/* ================= 状态管理 ================= */
const STORE_KEY = "jdwz_tiku_v1";
let state = { answers: {}, starred: [], wrong: [], skipRight: false };
try {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) state = Object.assign(state, JSON.parse(raw));
} catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function isMulti(t) { return t === "m"; }
function rightDone(id) { const r = state.answers[id]; return !!(r && r.ok); }
function filterSkipped(ids) {
  return state.skipRight ? ids.filter(function (id) { return !rightDone(id); }) : ids.slice();
}
function ansText(question, ans) {
  if (isMulti(question.type)) return (ans || []).map(function (i) { return question.opts[i]; }).join("、");
  return question.opts[ans];
}
function isRight(question, ans) {
  if (isMulti(question.type)) {
    if (!Array.isArray(ans) || ans.length !== question.ans.length) return false;
    const a = ans.slice().sort().join(","), b = question.ans.slice().sort().join(",");
    return a === b;
  }
  return ans === question.ans;
}

/* ================= 会话（练习/考试） ================= */
let session = null;
function startSession(list, opts) {
  session = {
    mode: opts.mode,               // practice | exam
    title: opts.title,
    list: list.map(function (id) { return QUESTIONS.find(function (x) { return x.id === id; }); }).filter(Boolean),
    idx: 0,
    picked: [],                    // 每题作答（多选为数组，提交前为预选）
    submitted: [],                 // 多选是否已点“提交答案”
    finished: false
  };
  renderRunner();
}
function cur() { return session.list[session.idx]; }
function allAnswered() { return session.picked.every(function (p) { return p !== null && p !== undefined; }); }
function answeredCount() { return session.picked.filter(function (p) { return p !== null && p !== undefined; }).length; }

function recordAnswer(question, ans) {
  const ok = isRight(question, ans);
  state.answers[question.id] = { a: ans, ok: ok };
  if (ok) {
    state.wrong = state.wrong.filter(function (id) { return id !== question.id; });
  } else if (state.wrong.indexOf(question.id) < 0) {
    state.wrong.push(question.id);
  }
  save();
  return ok;
}

/* ================= 渲染：首页 ================= */
function catStats() {
  const map = {};
  QUESTIONS.forEach(function (x) {
    if (!map[x.cat]) map[x.cat] = { total: 0, done: 0, right: 0 };
    map[x.cat].total++;
    const r = state.answers[x.id];
    if (r) { map[x.cat].done++; if (r.ok) map[x.cat].right++; }
  });
  return map;
}
function overall() {
  let done = 0, right = 0;
  QUESTIONS.forEach(function (x) { const r = state.answers[x.id]; if (r) { done++; if (r.ok) right++; } });
  return { done: done, right: right };
}
function renderHome() {
  session = null;
  const app = document.getElementById("app");
  const o = overall();
  const rate = o.done ? Math.round((o.right / o.done) * 100) : 0;
  const stats = catStats();
  const cats = Object.keys(stats);

  let html = "";
  html += '<div class="hero"><h1>军队文职记忆题库</h1><p>依据《国防知识手册》《基本知识必备手册》编制 · ' + QUESTIONS.length + ' 题</p>';
  html += '<div class="stat-row">'
    + '<div class="stat"><b>' + o.done + '/' + QUESTIONS.length + '</b><span>已练习</span></div>'
    + '<div class="stat"><b>' + rate + '%</b><span>正确率</span></div>'
    + '<div class="stat"><b>' + state.wrong.length + '</b><span>错题</span></div>'
    + '<div class="stat"><b>' + state.starred.length + '</b><span>收藏</span></div>'
    + '</div></div>';

  html += '<div class="mode-grid">'
    + '<div class="mode-card" onclick="goRandom()"><div class="ic">🎲</div><h3>随机练习</h3><p>打乱顺序，随时刷题</p></div>'
    + '<div class="mode-card hot" onclick="goExam()"><div class="ic">📝</div><h3>模拟考试</h3><p>随机50题 · 交卷出分</p></div>'
    + '<div class="mode-card" onclick="goWrong()"><div class="ic">📕</div><h3>答错的题' + (state.wrong.length ? '<span class="badge">' + state.wrong.length + '</span>' : '') + '</h3><p>做过且已答错，重点攻克</p></div>'
    + '<div class="mode-card" onclick="goRight()"><div class="ic">✅</div><h3>答对的题' + (o.right ? '<span class="badge ok">' + o.right + '</span>' : '') + '</h3><p>已掌握，定期回顾</p></div>'
    + '<div class="mode-card" onclick="goStar()"><div class="ic">⭐</div><h3>收藏练习' + (state.starred.length ? '<span class="badge">' + state.starred.length + '</span>' : '') + '</h3><p>复习收藏的题</p></div>'
    + '</div>';

  html += '<div class="switch-row' + (state.skipRight ? ' on' : '') + '" onclick="toggleSkipRight()">'
    + '<div class="txt"><b>跳过已答对的题</b><div class="sub">开启后，随机练习、章节练习不再出现答对过的题</div></div>'
    + '<div class="switch"><i></i></div></div>';

  html += '<div class="sec-title">按章节练习<small>点击进入</small></div><div class="cat-list">';
  cats.forEach(function (c, i) {
    const s = stats[c];
    const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
    html += '<div class="cat-card" onclick="goCat(\'' + c + '\')">'
      + '<div class="num">' + (i + 1) + '</div>'
      + '<div class="info"><b>' + c + '</b><div class="sub">' + s.total + ' 题 · 已练 ' + s.done + ' · 对 ' + s.right + '</div>'
      + '<div class="cat-bar"><div style="width:' + pct + '%"></div></div></div>'
      + '<div class="go">›</div></div>';
  });
  html += '</div>';

  html += '<div style="padding:0 16px"><button class="btn btn-ghost" style="width:100%;margin-top:6px;padding:12px;font-size:14px" onclick="resetAll()">清空练习记录</button></div>';
  html += '<div class="footer-note">进度自动保存在本机 · 数据不会上传</div>';
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ================= 渲染：答题/考试 ================= */
function renderRunner() {
  if (!session) return;
  const app = document.getElementById("app");
  const question = cur();
  const total = session.list.length;
  const pct = Math.round((session.idx / total) * 100);
  const starred = state.starred.indexOf(question.id) >= 0;
  const practice = session.mode === "practice";
  const myAns = session.picked[session.idx];
  const answered = myAns !== undefined && myAns !== null;
  // 只有练习模式下、且已提交（多选）或已作答（单选/判断）才判定并显示解析
  const committed = session.mode === "practice"
    ? (isMulti(question.type) ? !!session.submitted[session.idx] : answered)
    : false;

  const typeName = question.type === "s" ? "单选题" : (question.type === "m" ? "多选题" : "判断题");

  let html = "";
  html += '<div class="topbar">'
    + '<button class="btn-back" onclick="backHome()">‹ 返回</button>'
    + '<div class="title">' + session.title + '</div>'
    + (practice
      ? '<button class="btn-icon" onclick="toggleStar(' + question.id + ')" title="收藏">' + (starred ? "★" : "☆") + '</button>'
      : '<button class="btn-icon" onclick="submitExam()" title="交卷">交卷</button>')
    + '</div>';
  html += '<div class="progress-line"><div style="width:' + pct + '%"></div></div>';

  html += '<div class="qwrap">';
  html += '<div class="qmeta"><span class="tag ' + question.type + '">' + typeName + '</span>'
    + '<span class="tag cat">' + question.cat + '</span>'
    + '<span class="tag cat">' + (session.idx + 1) + '/' + total + '</span></div>';
  html += '<div class="qstem">' + question.stem + '</div>';
  html += '<div class="opts">';
  const letters = ["A", "B", "C", "D", "E", "F"];
  question.opts.forEach(function (opt, i) {
    let cls = "opt";
    const sel = isMulti(question.type)
      ? (Array.isArray(myAns) && myAns.indexOf(i) >= 0)
      : (myAns === i);
    if (sel) cls += " sel";
    if (committed) {
      const correctIdx = isMulti(question.type)
        ? question.ans.indexOf(i) >= 0
        : question.ans === i;
      if (correctIdx) cls += " right";
      else if (sel) cls += " wrong";
    }
    const mark = committed
      ? ((isMulti(question.type) ? question.ans.indexOf(i) >= 0 : question.ans === i) ? '<span class="mark">✓</span>' : (sel ? '<span class="mark">✗</span>' : ''))
      : "";
    html += '<button class="' + cls + '" ' + (committed ? "disabled" : "") + ' onclick="pick(' + i + ')">'
      + '<span class="letter">' + letters[i] + '</span><span>' + opt + '</span>' + mark + '</button>';
  });
  html += '</div>';

  if (practice && !committed && isMulti(question.type)) {
    html += '<div class="answer-area"><button class="btn btn-primary" onclick="submitMulti()" ' + ((Array.isArray(myAns) && myAns.length) ? "" : "disabled") + '>提交答案（已选 ' + ((Array.isArray(myAns) ? myAns.length : 0)) + ' 项）</button></div>';
  }

  if (practice && committed) {
    const ok = isRight(question, myAns);
    html += '<div class="exp-box show">'
      + '<div class="verdict ' + (ok ? "ok" : "no") + '">' + (ok ? "✓ 回答正确" : "✗ 回答错误") + '</div>'
      + '<div style="margin-bottom:6px">正确答案：<b>' + ansText(question, question.ans) + '</b></div>'
      + '<div class="exp-title">解析</div>' + question.exp + '</div>';
  }
  html += '</div>';

  html += '<div class="actionbar">'
    + '<button class="btn btn-ghost" ' + (session.idx === 0 ? "disabled" : "") + ' onclick="prevQ()">上一题</button>'
    + (session.idx < total - 1
      ? '<button class="btn btn-primary" onclick="nextQ()">下一题</button>'
      : (practice ? '<button class="btn btn-primary" onclick="finishPractice()">完成练习</button>' : '<button class="btn btn-primary" onclick="submitExam()">交卷</button>'))
    + '</div>';
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ================= 交互 ================= */
function pick(i) {
  const question = cur();
  if (isMulti(question.type)) {
    // 多选：先勾选/取消，点“提交答案”后才判定
    if (session.mode === "practice" && session.submitted[session.idx]) return;
    let arr = Array.isArray(session.picked[session.idx]) ? session.picked[session.idx].slice() : [];
    const at = arr.indexOf(i);
    if (at >= 0) arr.splice(at, 1); else arr.push(i);
    arr.sort(function (a, b) { return a - b; });
    session.picked[session.idx] = arr;
    renderRunner();
    return;
  }
  const done = session.picked[session.idx] !== undefined && session.picked[session.idx] !== null;
  if (session.mode === "practice") {
    if (done) return;   // 本回合已答过，仅可查看解析
    session.picked[session.idx] = i;
    recordAnswer(question, i);
  } else {
    session.picked[session.idx] = i;
  }
  renderRunner();
}
function submitMulti() {
  const question = cur();
  const arr = session.picked[session.idx];
  if (!Array.isArray(arr) || !arr.length) return;
  session.picked[session.idx] = arr.slice();
  session.submitted[session.idx] = true;
  recordAnswer(question, arr);
  renderRunner();
}
function nextQ() { if (session.idx < session.list.length - 1) { session.idx++; renderRunner(); } }
function prevQ() { if (session.idx > 0) { session.idx--; renderRunner(); } }
function toggleSkipRight() {
  state.skipRight = !state.skipRight;
  save(); renderHome();
  toast(state.skipRight ? "已开启：不再刷出答对的题" : "已关闭：全部题目都刷");
}
function toggleStar(id) {
  const at = state.starred.indexOf(id);
  if (at >= 0) state.starred.splice(at, 1); else state.starred.push(id);
  save(); renderRunner();
  toast(at >= 0 ? "已取消收藏" : "已收藏");
}
function backHome() { renderHome(); }

function finishPractice() {
  const total = session.list.length;
  let right = 0;
  session.list.forEach(function (x, i) { const a = session.picked[i]; if (a !== null && a !== undefined && isRight(x, a)) right++; });
  const pct = total ? Math.round((right / total) * 100) : 0;
  const pass = pct >= 60;
  let html = '<div class="topbar"><button class="btn-back" onclick="backHome()">‹ 返回</button><div class="title">练习完成</div><div style="width:38px"></div></div>';
  html += '<div class="result"><div class="score-ring ' + (pass ? "pass" : "fail") + '"><b>' + pct + '</b><span>正确率</span></div>'
    + '<h2>' + (pass ? "练习完成，继续保持！" : "继续加油，多练几遍！") + '</h2>'
    + '<p>共 ' + total + ' 题 · 答对 ' + right + ' 题 · 答错 ' + (total - right) + ' 题</p>'
    + '<div class="rbtns">'
    + '<button class="btn btn-primary" onclick="repeatSession()">再练一遍</button>'
    + '<button class="btn btn-ghost" onclick="goWrong()">查看错题（' + state.wrong.length + '）</button>'
    + '<button class="btn btn-ghost" onclick="backHome()">返回首页</button>'
    + '</div></div>';
  document.getElementById("app").innerHTML = html;
  window.scrollTo(0, 0);
}
function repeatSession() {
  const mode = session.mode, title = session.title, list = session.list.map(function (x) { return x.id; });
  shuffle(list);
  startSession(list, { mode: mode, title: title });
}

/* ================= 考试 ================= */
function submitExam() {
  if (!session || session.mode !== "exam") return;
  const un = total - answeredCount();
  if (un > 0 && !confirm("还有 " + un + " 题未作答，确定交卷吗？")) return;
  let right = 0;
  session.list.forEach(function (x, i) {
    const a = session.picked[i];
    if (a !== null && a !== undefined && isRight(x, a)) right++;
  });
  const total = session.list.length;
  const pct = total ? Math.round((right / total) * 100) : 0;
  const pass = pct >= 60;
  let wrongItems = [];
  session.list.forEach(function (x, i) {
    const a = session.picked[i];
    if (a === null || a === undefined || !isRight(x, a)) wrongItems.push({ x: x, a: a });
  });
  let html = '<div class="topbar"><button class="btn-back" onclick="backHome()">‹ 返回</button><div class="title">考试结果</div><div style="width:38px"></div></div>';
  html += '<div class="result"><div class="score-ring ' + (pass ? "pass" : "fail") + '"><b>' + pct + '</b><span>得分</span></div>'
    + '<h2>' + (pass ? "恭喜通过！（60分及格）" : "未通过，及格线60分") + '</h2>'
    + '<p>共 ' + total + ' 题 · 答对 ' + right + ' 题 · 答错 ' + (total - right) + ' 题</p>';
  if (wrongItems.length) {
    html += '<div class="wrong-list"><h3>错题回顾（点击看解析）</h3>';
    wrongItems.forEach(function (it) {
      html += '<div class="wrong-item" onclick="showExamExp(' + it.x.id + ')">'
        + '<div class="wt">' + it.x.stem + '</div>'
        + '<div class="wy">你的答案：<b class="red">' + (it.a === null || it.a === undefined ? "未作答" : escapeHtml(ansText(it.x, it.a))) + '</b><br>正确答案：<b class="green">' + escapeHtml(ansText(it.x, it.x.ans)) + '</b></div></div>';
    });
    html += '<div id="expSlot"></div></div>';
  }
  html += '<div class="rbtns">'
    + '<button class="btn btn-primary" onclick="goExam()">再考一次</button>'
    + '<button class="btn btn-ghost" onclick="backHome()">返回首页</button>'
    + '</div></div>';
  document.getElementById("app").innerHTML = html;
  window.scrollTo(0, 0);
  session = null;
}
function showExamExp(id) {
  const x = QUESTIONS.find(function (q) { return q.id === id; });
  const slot = document.getElementById("expSlot");
  slot.innerHTML = '<div class="exp-box show" style="margin-top:12px"><div class="exp-title">解析</div>' + x.exp + '</div>';
  slot.scrollIntoView({ behavior: "smooth", block: "center" });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* ================= 入口 ================= */
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }
function allIds() { return QUESTIONS.map(function (x) { return x.id; }); }
function goRandom() {
  const ids = filterSkipped(shuffle(allIds()));
  if (!ids.length) { toast("全部题目都已答对，可关闭「跳过已答对的题」"); return; }
  startSession(ids.slice(0, Math.min(30, ids.length)), { mode: "practice", title: "随机练习" });
}
function goCat(cat) {
  const ids = filterSkipped(QUESTIONS.filter(function (x) { return x.cat === cat; }).map(function (x) { return x.id; }));
  if (!ids.length) { toast("该章节已全部答对，可关闭「跳过已答对的题」"); return; }
  startSession(ids, { mode: "practice", title: cat });
}
function goExam() {
  const ids = shuffle(allIds()).slice(0, Math.min(50, QUESTIONS.length));
  startSession(ids, { mode: "exam", title: "模拟考试" });
}
function goWrong() {
  if (!state.wrong.length) { toast("暂无错题，先去练习吧"); return; }
  startSession(state.wrong.slice(), { mode: "practice", title: "错题重练" });
}
function goRight() {
  const ids = QUESTIONS.filter(function (x) { return rightDone(x.id); }).map(function (x) { return x.id; });
  if (!ids.length) { toast("还没有答对的题，先去练习吧"); return; }
  startSession(ids, { mode: "practice", title: "答对的题" });
}
function goStar() {
  if (!state.starred.length) { toast("暂无收藏，先去收藏几题吧"); return; }
  startSession(state.starred.slice(), { mode: "practice", title: "收藏练习" });
}
function resetAll() {
  if (!confirm("确定清空所有练习记录、错题和收藏吗？")) return;
  state = { answers: {}, starred: [], wrong: [], skipRight: state.skipRight };
  save(); renderHome(); toast("已清空");
}
let toastTimer = null;
function toast(msg) {
  let el = document.querySelector(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove("show"); }, 1600);
}

renderHome();
</script>
</body>
</html>
